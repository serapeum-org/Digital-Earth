[project]
name = "digitalearth"
version = "0.5.0"
description = "Geospatial visualization package for rasters and vector data"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
license = {text = "GNU General Public License v3"}
keywords = ["matplotlib", "maps", "visualization", "GIS"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is intentionally omitted from runtime deps: conda-forge / pixi
# users get gdal via the feedstock, and pyramids-gis pulls native GDAL
# in transitively. Listing pip's PyPI GDAL would force a from-source
# build on Windows (no wheel exists) and break most end-user installs.
dependencies = [
    "numpy >=2.0.0",
    "geopandas >=1.1.3",
    "cleopatra >=0.17.0",
    "pyramids-gis >=0.32.0",
    "loguru >=0.7.3",
    "pyyaml >=6.0",
]

[project.optional-dependencies]
# True-3D tier (PyVista). geovista (textured globe, D3.5) is folded in but imported lazily inside `globe()`,
# so the rest of the tier works without it. None of these is a GIS competitor — pyramids stays the only GIS dep.
"3d" = [
    "pyvista >=0.48",
    "trame >=3.13",
    # trame-vtk / trame-vuetify are the widget backends export_html (interactive HTML save) needs; the bare
    # `trame` meta-package does not pull them, so list them explicitly or `export_html` raises at runtime.
    "trame-vtk >=2.8",
    "trame-vuetify >=2.7",
    "geovista >=0.5.3",
    "imageio >=2.34",
    "imageio-ffmpeg >=0.5",
]
# Interactive-2D tier (HoloViz: GeoViews -> HoloViews -> Bokeh, + Datashader + Panel). cartopy/pyproj arrive
# transitively under geoviews as *its* deps and are never imported by us — pyramids stays the only GIS engine
# (enforced by tests/test_no_competitor_imports.py).
interactive = [
    "geoviews >=1.15",
    "holoviews >=1.22",
    "hvplot >=0.12",
    "datashader >=0.19",
    "panel >=1.9",
]

[project.scripts]
digitalearth = "digitalearth.cli:main"

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=4.6.0",
    "pre-commit-hooks >=6.0.0",
    "pytest >=9.0.3",
    "pytest-cov >= 7.1.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.5.0",
    "twine>=6.2.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.16.2",
    "mypy>=2.1.0",
    "pytest-mock>=3.15.1",
    "pytest-mpl>=0.17.0"
]
docs = [
    "mkdocs >=1.6.1",
    "mkdocs-material >=9.7.6",
    "mkdocstrings >=1.0.4",
    "mkdocstrings-python >=2.0.3",
    "mike >=2.2.0",
    "mkdocs-jupyter >=0.26.3",
    "mkdocs-autorefs  >=1.4.4",
    "mkdocs-macros-plugin  >=1.5.0",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.3",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.urls]
homepage = "https://github.com/serapeum-org/Digital-Earth"
repository = "https://github.com/serapeum-org/Digital-Earth"
documentation = "https://serapeum-org.github.io/Digital-Earth"
Changelog = "https://github.com/serapeum-org/Digital-Earth/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalearth", "digitalearth.*"]

[tool.setuptools.package-data]
"digitalearth.autostyle" = ["library/*.yml"]

[tool.flake8]
ignore = ["E203", "E266", "E501", "W503", "E722", "C901", "E741", "E731"]
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4"

[tool.black]
profile = "flake8"
line-length = 88
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/digitalearth"]
# Emit repo-root-relative file paths in coverage.xml (e.g. src/digitalearth/...) so Codecov merges the
# coverage uploaded from the ubuntu/windows/macos matrix instead of treating the absolute paths as distinct.
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["digitalearth"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
# Stay in 0.x: a breaking change (``feat!`` / ``BREAKING CHANGE``) bumps the MINOR (0.3.0 -> 0.4.0), not the
# MAJOR (-> 1.0.0). The project graduates to 1.0.0 deliberately, never as a side effect of a single commit.
major_version_zero = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]

# pyramids-gis ships its Linux wheels tagged manylinux_2_39 (its bundled
# GDAL is conda-forge GCC-13 -> GLIBCXX_3.4.32). pixi's default linux-64
# baseline is glibc 2.17, so the wheel is rejected and 0.27.0 (wheel-only,
# no sdist) becomes unsatisfiable. Advertise glibc 2.39 so the wheel
# matches. Targets Ubuntu 24.04+ / RHEL 10+. See pyramids issue #338.
[tool.pixi.system-requirements]
libc = "2.39"

[tool.pixi.pypi-dependencies]
digitalearth = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/digitalearth -sv --cov-report=xml", description = "Run the main test suite" }
test-all = { cmd = "pytest -vvv --cov=src/digitalearth -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples --ignore-glob='docs/examples/**/dask-lazy-*.ipynb' --ignore-glob='docs/examples/**/lazy-*-complete.ipynb' --ignore-glob='docs/examples/**/stac-cloud-*.ipynb' --ignore-glob='docs/examples/**/*_3d_*.ipynb' --ignore-glob='docs/examples/pyvista/**'", description = "check notebooks (skips dask cookbooks + stac-cloud-* — all hit real endpoints; and the 3-D/PyVista notebooks — those need the viz3d env, run via `notebooks-3d`)" }
notebooks-3d = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples/pyvista", description = "check the 3-D (PyVista) notebooks — run in the viz3d env (`pixi run -e viz3d notebooks-3d`)" }
test-interactive = { cmd = "pytest -vvv tests/test_interactive_*.py", description = "Run the interactive (HoloViz) tier tests — run in the interactive env (`pixi run -e interactive test-interactive`)" }
notebooks-interactive = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples/interactive", description = "check the interactive (HoloViz) notebooks — run in the interactive env (`pixi run -e interactive notebooks-interactive`)" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "launch jupyter lab" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
docs-serve = { cmd = "mkdocs serve", description = "Serve the documentation locally" }
docs-build = { cmd = "mkdocs build", description = "Build the documentation site" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }


[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
# 3D tier (PyVista). Separate solve-group so VTK stays out of the lean default/dev envs.
# Run the 3D tests with: pixi run -e viz3d pytest tests/test_scene3d.py
viz3d = { features = ["dev", "viz3d"], solve-group = "viz3d" }
# Interactive tier (HoloViz). Separate solve-group so geoviews/datashader/panel stay out of default/dev.
# Run the interactive tests with: pixi run -e interactive test-interactive
interactive = { features = ["dev", "interactive"], solve-group = "interactive" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }


[tool.pixi.feature.interactive.pypi-dependencies]
# PyPI wheels (cartopy ships binary wheels; GEOS/PROJ are already present via the conda gdal/pyogrio stack).
# cartopy/pyproj are geoviews' own transitive deps — never imported by Digital-Earth (DX.3 guard).
geoviews = ">=1.15"
holoviews = ">=1.22"
hvplot = ">=0.12"
datashader = ">=0.19"
panel = ">=1.9"

[tool.pixi.feature.viz3d.pypi-dependencies]
# PyPI wheels (pyvista bundles a VTK wheel) — keeps the 3D tier installable without a heavy conda solve.
# geovista powers the optional textured globe (D3.5); it is imported lazily inside Scene3D.globe().
pyvista = ">=0.48"
trame = ">=3.13"
# Widget backends export_html needs (the `trame` meta-package alone is insufficient — see the [3d] extra note).
trame-vtk = ">=2.8"
trame-vuetify = ">=2.7"
geovista = ">=0.5.3"
imageio = ">=2.34"
imageio-ffmpeg = ">=0.5"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.dependencies]
# Cap Python below 3.14 for the unpinned envs (default/dev/docs/notebook):
# 3.14 is outside the supported range and many GIS deps (gdal, pyproj, ...) have
# no 3.14 wheels yet, forcing source builds. py311/py312/py313 override this.
python = ">=3.11,<3.14"
gdal = ">=3.13.0,<4"
# Conda-forge's geopandas-base no longer pulls in a vector-IO backend.
# pyogrio is required for GeoDataFrame.to_file / read_file.
pyogrio = ">=0.12.1"
