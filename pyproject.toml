[project]
name = "digitalearth"
version = "0.10.0"
description = "Geospatial visualization package for rasters and vector data"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{ name = "Mostafa Farrag", email = "moah.farag@gmail.com" }]
license = {text = "GNU General Public License v3"}
keywords = ["matplotlib", "maps", "visualization", "GIS"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

# GDAL is intentionally omitted from runtime deps: conda-forge / pixi
# users get gdal via the feedstock, and pyramids-gis pulls native GDAL
# in transitively. Listing pip's PyPI GDAL would force a from-source
# build on Windows (no wheel exists) and break most end-user installs.
dependencies = [
    "numpy >=2.0.0",
    "pandas >=2.0.0",
    # base/ imports both directly (pandas in symbology, matplotlib's colour registry in
    # categorical_colors), so they are declared rather than inherited from geopandas'/cleopatra's
    # closures -- an engine-neutral layer cannot source its imports from one backend's engine.
    "matplotlib >=3.8",
    "geopandas >=1.1.3",
    # 0.39.0 is a floor, not a preference: it made the watermark stamps glyph methods on
    # WatermarkMixin and took the free stamp_mark() function private, so static/scene.py and
    # static/textured_globe.py cannot import the old name. An uncapped >=0.37 let CI resolve
    # 0.39 against code that still called the function, which is how it broke.
    "cleopatra[tiles] >=0.39.0",
    # static/maps/decoration.py constructs the TileProvider a keyed basemap is handed to cleopatra as,
    # so it is imported directly here and declared for the same reason matplotlib is above: it currently
    # arrives through cleopatra's [tiles] extra, and an import satisfied by another package's extra is
    # one repackaging away from a ModuleNotFoundError raised from inside basemap().
    "xyzservices >=2023.10.0",
    "pyramids-gis >=0.62.0",
    "loguru >=0.7.3",
    "pyyaml >=6.0",
]

[project.optional-dependencies]
# True-3D tier (PyVista). geovista (textured globe, D3.5) is folded in but imported lazily inside `globe()`,
# so the rest of the tier works without it. None of these is a GIS competitor — pyramids stays the only GIS dep.
# NOTE: pixi exposes this extra as a feature named `3d`, which the `viz3d` env uses directly — do NOT also
# declare a `[tool.pixi.feature.viz3d.pypi-dependencies]` table duplicating these.
"3d" = [
    # `pyvista[jupyter]` is not a notebook nicety — that extra IS pyvista's trame/vtk.js export stack, the one
    # `export_html` runs on, and pyvista redefines it per version: 0.48 pulls trame + trame-client/-server/-vtk
    # (with its own exclusions) + trame-vuetify + nest-asyncio2, while 0.49 moved trame support out to
    # trame-pyvista. Hand-listing the 0.48 shape here broke `export_html` on 0.49 and dropped nest-asyncio2 on
    # every version (#158), so let pyvista declare its own stack instead of restating it.
    # The trade this makes: `jupyter` also carries `ipywidgets` and (on 0.48) `jupyter-server-proxy`, which
    # pulls jupyter-server/tornado/simpervisor. A headless or CLI user of the 3-D tier installs that notebook
    # stack too. Accepted deliberately — it is what keeps the export dependencies correct per pyvista version.
    "pyvista[jupyter] >=0.48",
    "geovista >=0.5.3",
    "imageio >=2.34",
    "imageio-ffmpeg >=0.5",
]
# Interactive-2D tier (HoloViz: GeoViews -> HoloViews -> Bokeh, + Datashader + Panel). cartopy/pyproj arrive
# transitively under geoviews as *its* deps and are never imported by us — pyramids stays the only GIS engine
# (enforced by tests/test_no_competitor_imports.py).
# NOTE: pixi exposes this extra as a feature named `interactive`, which the `interactive` env uses directly —
# do NOT also declare a `[tool.pixi.feature.interactive.pypi-dependencies]` table (it would double-declare these
# and break `pixi update` with "geoviews is already a dependency").
interactive = [
    "geoviews >=1.15",
    "holoviews >=1.22",
    "hvplot >=0.12",
    "datashader >=0.19",
    "panel >=1.9",
]
# Web tier (MapLibre GL JS + deck.gl via their anywidget Python bindings). `maplibre` (py-maplibregl) drives both
# the MapLibre basemap/vector layers AND deck.gl overlays from one widget. It is not a GIS competitor — it is a
# renderer; pyramids stays the only GIS dep (enforced by tests/test_no_competitor_imports.py).
# `lonboard` was declared here for recipe W3's GeoArrow path and never imported: py-maplibregl's deck integration
# consumes deck.gl JSON / pydeck layers, not lonboard widget objects, and the two cannot be composited into one
# `maplibre` widget — so the tier drives deck.gl through `add_deck_layers` instead (see web/bigdata.py). It pulled
# a GeoArrow/pyarrow stack into every install for nothing, so it is gone; a lonboard-native renderer would be a
# separate widget, and can re-declare it when someone builds one.
# The `[ipywidget]` extra is NOT optional: `maplibre` declares `anywidget` only under it, and the whole tier is
# built on `maplibre.ipywidget.MapWidget`. Bare `maplibre` imports and then fails at render with
# `NameError: name 'AnyWidget' is not defined` — until now that was masked because lonboard pulled anywidget in
# transitively, exactly the kind of borrowed dependency the comment on `xyzservices` above rejects.
# NOTE: pixi exposes this extra as a feature named `web`, which the `web` env uses directly — do NOT also declare a
# `[tool.pixi.feature.web.pypi-dependencies]` table (it would double-declare these and break `pixi update`).
web = [
    "maplibre[ipywidget] >=0.3",
]
# Every optional backend in one install: `pip install digitalearth[all]`. Written as a self-reference so the
# three lists above stay the single source of truth — adding a package to `web` reaches `all` automatically,
# and the two can never drift. Note this pulls three rendering stacks (VTK, the HoloViz stack, MapLibre) into
# one environment; the per-backend extras exist because most users want exactly one of them.
all = ["digitalearth[3d,interactive,web]"]

[project.scripts]
digitalearth = "digitalearth.ops.cli:main"

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=4.6.0",
    "pre-commit-hooks >=6.0.0",
    "pytest >=9.0.3",
    "pytest-cov >= 7.1.0",
    "pytest-env>=1.6.0",
    "coverage",
    "build>=1.5.0",
    "twine>=6.2.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen>=4.16.2",
    "mypy>=2.1.0",
    "pytest-mock>=3.15.1",
    "pytest-mpl>=0.17.0",
    # Pinned, not floored: the `lint` task and the ruff-pre-commit hook must agree, so this tracks
    # `rev: v0.15.22` in .pre-commit-config.yaml. Bump both together.
    "ruff ==0.15.22"
]
docs = [
    "mkdocs >=1.6.1",
    "mkdocs-material >=9.7.6",
    "mkdocstrings >=1.0.4",
    "mkdocstrings-python >=2.0.3",
    "mike >=2.2.0",
    "mkdocs-jupyter >=0.26.3",
    "mkdocs-autorefs  >=1.4.4",
    "mkdocs-macros-plugin  >=1.5.0",
    "mkdocs-table-reader-plugin  >=3.1.0",
    "mkdocs-mermaid2-plugin  >=1.2.3",
    "jupyter-contrib-nbextensions  >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook<7.0",
]
notebook = [
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "ipykernel"
]


[project.urls]
homepage = "https://github.com/serapeum-org/Digital-Earth"
repository = "https://github.com/serapeum-org/Digital-Earth"
documentation = "https://serapeum-org.github.io/Digital-Earth"
Changelog = "https://github.com/serapeum-org/Digital-Earth/blob/main/docs/change-log.md"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalearth", "digitalearth.*"]

[tool.setuptools.package-data]
"digitalearth.base.autostyle" = ["library/*.yml"]

# Ruff replaces black + isort + flake8 + pyupgrade (and their nbqa notebook wrappers): one engine and one
# line-length ruler, so the formatter and the import sorter can't disagree. Mirrors pyramids' current config.
[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]

[tool.ruff.lint]
# E/F/W is the effective flake8 set (the old B/T4 selectors were inert — flake8-bugbear / flake8-print
# were never installed); add I (isort) and UP (pyupgrade) to fold in those standalone hooks.
select = ["E", "F", "W", "I", "UP"]
# Mirror the old flake8 ignores; E704/W503 are dropped (ruff doesn't implement them — both are
# formatter-owned pycodestyle codes).
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", "planning", "docs"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/digitalearth"]
# Emit repo-root-relative file paths in coverage.xml (e.g. src/digitalearth/...) so Codecov merges the
# coverage uploaded from the ubuntu/windows/macos matrix instead of treating the absolute paths as distinct.
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.mypy]
# Checker target is 3.12 even though `requires-python` floors at 3.11: numpy 2.5
# ships PEP 695 `type` statements in its stubs, which mypy only parses when the
# target is >= 3.12 (at 3.11 it aborts with a syntax error before checking any
# source). This only widens the *typing* target; actual 3.11 runtime
# compatibility is covered by the py311 leg of the test matrix, not by mypy.
python_version = "3.12"
mypy_path = "src"
packages = ["digitalearth"]
explicit_package_bases = true
warn_return_any = true
# On, because the baseline below is a ratchet: an entry naming a module that was renamed or deleted would
# otherwise be accepted in silence, and this repo has just renamed `scene/` -> `static/`. With this on, mypy
# names the dead entry (`note: unused section(s)`) so draining the list stays honest. It is a diagnostic, not
# a gate — it does not change the exit code — so it reports the rot without turning a rename into a red CI.
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "scripts/",
    "planning/",
]


# --- mypy baseline (#172) -------------------------------------------------------------------------------
#
# Recorded 2026-09-09 against 109 remaining errors, down from 403. The 294 already closed were closed by
# TYPING them, not by listing them here: the backend mixins now declare the composed-class contract their
# methods reach through `self`, and the fluent builders return PEP 673 `Self`.
#
# What is left is genuinely per-module, so it is listed per-module rather than globally disabled: a blanket
# `disable_error_code` would also silence these codes in code written tomorrow, which is the failure mode
# this baseline exists to avoid. New modules are checked in full from the moment they are added, because a
# module with no entry here inherits the strict settings above.
#
# THIS LIST IS A RATCHET. It may shrink; it must never grow. Draining an entry is a normal, small piece of
# work: delete it, run `pixi run -e dev mypy`, fix what surfaces. The counts below are what each module owed
# on the day the baseline was taken.
#
# The dominant causes, so the entries are not mysterious:
#   * attr-defined  — the base classes call methods their mixins provide (the inverse of the coupling now
#                     typed on the mixin side); plus untyped third-party surface (pyramids, cleopatra).
#   * no-any-return — a function annotated with a real return type forwards an untyped third-party call.
#   * union-attr    — an Optional attribute used without a narrowing guard; these are worth real fixes.
#   * arg-type      — numpy arrays passed where a Sequence[float] is declared.

[[tool.mypy.overrides]]
module = "digitalearth.api"  # 19 errors at baseline
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "digitalearth.web.vector"  # 9 errors at baseline
disable_error_code = ["attr-defined", "list-item", "no-any-return", "no-redef"]

[[tool.mypy.overrides]]
module = "digitalearth.interactive.vector"  # 8 errors at baseline
disable_error_code = ["attr-defined", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.web.threed"  # 8 errors at baseline
disable_error_code = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = "digitalearth.web.base"  # 5 errors at baseline
disable_error_code = ["attr-defined", "no-any-return"]


[[tool.mypy.overrides]]
module = "digitalearth.static.maps.animation"  # 4 errors at baseline
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "digitalearth.web.bigdata"  # 4 errors at baseline
disable_error_code = ["attr-defined", "misc", "type-var"]

[[tool.mypy.overrides]]
module = "digitalearth.interactive.base"  # 3 errors at baseline
disable_error_code = ["attr-defined", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.interactive.bigdata"  # 3 errors at baseline
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "digitalearth.interactive.raster"  # 3 errors at baseline
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.static.maps.decoration"  # 3 errors at baseline
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "digitalearth.static.maps.vector"  # 3 errors at baseline
disable_error_code = ["arg-type", "no-any-return", "union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.static.render_compat"  # 3 errors at baseline
disable_error_code = ["arg-type", "attr-defined"]

[[tool.mypy.overrides]]
module = "digitalearth.static.temporal.climatology"  # 3 errors at baseline
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
# 3 at baseline (attr-defined). union-attr and arg-type arrived with the time-slider feature merged
# from main (#163) while this branch was open -- `.z` is `DimensionInfo | None` and is dereferenced
# without a narrowing guard in two places, and a `str | None` is appended to a `list[str]`. Latent
# Optional-narrowing gaps in that feature, not this branch's work, so they are recorded rather than
# fixed here; worth a real fix by whoever owns the time-slider.
module = "digitalearth.web.temporal"  # 6 errors
disable_error_code = ["arg-type", "attr-defined", "union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.base.crs"  # 2 errors at baseline
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "digitalearth.interactive.decoration"  # 2 errors at baseline
disable_error_code = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = "digitalearth.interactive.temporal"  # 2 errors at baseline
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.static.glyph"  # 2 errors at baseline
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.static.maps.raster"  # 2 errors at baseline
disable_error_code = ["dict-item", "union-attr"]

[[tool.mypy.overrides]]
module = "digitalearth.static.scene"  # 2 errors at baseline
disable_error_code = ["assignment", "exit-return"]

[[tool.mypy.overrides]]
module = "digitalearth.static.series"  # 2 errors at baseline
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
module = "digitalearth.three_d.base"  # 2 errors at baseline
disable_error_code = ["exit-return", "no-any-return"]

[[tool.mypy.overrides]]
module = "digitalearth.base.arrays"  # 1 error at baseline
disable_error_code = ["no-any-return"]


[[tool.mypy.overrides]]
module = "digitalearth.static.figures"  # 1 error at baseline
disable_error_code = ["return-value"]

[[tool.mypy.overrides]]
module = "digitalearth.static.maps.projection"  # 1 error at baseline
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "digitalearth.static.projections"  # 1 error at baseline
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "digitalearth.static.textured_globe"  # 1 error at baseline
disable_error_code = ["exit-return"]

[[tool.mypy.overrides]]
module = "digitalearth.three_d.globe"  # 1 error at baseline
disable_error_code = ["union-attr"]


[[tool.mypy.overrides]]
module = "digitalearth.three_d.terrain"  # 1 error at baseline
disable_error_code = ["union-attr"]


[[tool.mypy.overrides]]
module = "digitalearth.web.raster"  # 1 error at baseline
disable_error_code = ["union-attr"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
# Stay in 0.x: a breaking change (``feat!`` / ``BREAKING CHANGE``) bumps the MINOR (0.3.0 -> 0.4.0), not the
# MAJOR (-> 1.0.0). The project graduates to 1.0.0 deliberately, never as a side effect of a single commit.
major_version_zero = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.pytest.ini_options]
env = ["MPLBACKEND=Agg"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "mpl: a visual-regression test that returns a Figure for pytest-mpl to compare against tests/baseline",
    # pytest-mpl registers this itself, but only when it is installed. Registering it here as well keeps a
    # plugin-less run (the pure-wheel job, which installs no pytest-mpl) from emitting one
    # PytestUnknownMarkWarning per decorated test while collecting tests it then deselects with -m 'not mpl'.
    "mpl_image_compare: pytest-mpl's own marker, re-registered so a run without the plugin stays quiet",
    "image3d: a 3-D visual-regression test compared against tests/baseline3d when --image3d-compare is given",
]

# pytest-mpl. `--mpl` is deliberately NOT in addopts: without it a decorated test still runs but compares
# nothing, so a contributor whose baselines are missing or stale is never blocked by the normal suite. The
# comparison is opt-in through the `test-images` task (`pytest -m mpl --mpl`), which CI runs as its own job;
# `main`/`test-all` deselect the marker instead, because an uncompared image test only re-covers what the
# rest of tests/static/ already asserts.
#
# Baselines are regenerated with `test-images-generate` (`pytest -m mpl --mpl-generate-path=tests/baseline`).
# The path is resolved against the directory pytest runs in, which for this project is always the repo root
# (the fixtures read `examples/data/...` the same way).
mpl-baseline-path = "tests/baseline"
# Root-mean-square difference between the two images, on the 0-255 scale, averaged over every pixel — so a
# change confined to a small part of the frame scores far lower than the same change across all of it.
#
# Re-measured against the committed baselines, one semantic perturbation per figure, across all 18:
#   * noise floor: an unchanged re-render scores exactly 0.000, on all 18, repeatably;
#   * weakest real change: 3.96 (one shared-colorbar panel, contour levels 6 -> 7). Then 4.40 (one scatter
#     point moved 2 km), 4.44 (graticule dropped), 4.53 (lon/lat step 30 -> 45), 5.28/5.58 (borders dropped,
#     flat and globe), 7.20 (the RGB stretch frozen to fixed limits), 7.76/9.31 (a colorbar label dropped);
#   * the rest are comfortable: 8.15-11.40 (legend colours/labels), 14.76 (contourf levels 6 -> 7), 20.06
#     (choropleth colormap swap), 20.42 (u/v swapped), 21.21-34.85 (a colormap swap on a full-frame field),
#     38.51 (categorical colormap swap), 68.18 (KDE colormap swap), 94.39 (RGB band order reversed).
#
# 1, not the 2 this held before, and not pytest-mpl's own DEFAULT_TOLERANCE — which 2 silently was. 2 left
# only a 2.0x margin under the weakest real change and, measured here, tolerated a uniform +2.5/255 shift
# over the entire frame; 1 leaves 4.0x and tolerates +1.3/255. It is not tighter still because the local ->
# windows-latest delta cannot be measured from a developer machine: a green run at 2 bounds it below 2 and
# no lower, so the remaining headroom is deliberate. Note the old justification for 2 — "absorbs the
# antialiasing jitter of a matplotlib patch release" — does not survive measurement: switching text
# antialiasing off moves these figures by a median RMS of 9.9, an order of magnitude past any tolerance
# worth setting. A rasteriser change is answered by regenerating the baselines, never by a looser number.
#
# Loosen or tighten ONE figure with `@pytest.mark.mpl_image_compare(tolerance=...)` rather than moving this.
mpl-default-tolerance = 1
# Strip the matplotlib version and the creation date from the PNG metadata, so a regenerated baseline differs
# only where the picture differs and re-running the generator produces byte-identical files.
mpl-deterministic = true


[tool.pixi.workspace]
channels = ["conda-forge"]
# osx-arm64 (Apple Silicon), not osx-64: the numba/llvmlite stack the `interactive` tier pulls
# (datashader -> numba -> llvmlite) ships macOS wheels for arm64 only — there are no Intel-mac (x86_64)
# wheels for Python 3.13, so osx-64 forces a source build that backtracks into a legacy llvmlite that
# refuses Python >=3.10. arm64 also matches CI (GitHub macos-latest is Apple Silicon).
platforms = ["win-64", "linux-64", "osx-arm64"]


[tool.pixi.pypi-dependencies]
digitalearth = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv -m 'not mpl' --cov=src/digitalearth -sv --cov-report=xml", description = "Run the main test suite (the `mpl` visual-regression tests are deselected — without `--mpl` they compare nothing; run them via `test-images`)" }
test-all = { cmd = "pytest -vvv -m 'not mpl' --cov=src/digitalearth -sv --cov-report=xml --cov-report=term-missing", description = "Run all testsuite (same `mpl` deselection as `main`)" }
test-images = { cmd = "pytest -vvv -m mpl --mpl --cov=src/digitalearth --cov-report=xml", description = "Compare the static backend's figures against the committed baseline PNGs in tests/baseline (pytest-mpl). Carries --cov like every other tier task, because `main` deselects these tests and this is the only job that reports the 18 rendering paths. Regenerate the baselines with `test-images-generate` after a deliberate rendering change. Note it writes coverage.xml like the other tier tasks, so locally it replaces a full `main` report with an 18-test one -- re-run `main` before reading coverage; in CI the two are separate jobs and never collide" }
test-images-generate = { cmd = "pytest -m mpl --mpl-generate-path=tests/baseline", description = "Regenerate every tests/baseline PNG from the current rendering — review the image diff before committing, it is the record of what the change did to the picture" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples --ignore-glob='docs/examples/**/dask-lazy-*.ipynb' --ignore-glob='docs/examples/**/lazy-*-complete.ipynb' --ignore-glob='docs/examples/**/stac-cloud-*.ipynb' --ignore-glob='docs/examples/**/*_3d_*.ipynb' --ignore-glob='docs/examples/pyvista/**' --ignore-glob='docs/examples/interactive/**' --ignore-glob='docs/examples/web/**'", description = "check notebooks (skips dask cookbooks + stac-cloud-* — all hit real endpoints; the 3-D/PyVista notebooks need the viz3d env, run via `notebooks-3d`; the interactive/HoloViz notebooks need the interactive env, run via `notebooks-interactive`; the web/MapLibre notebooks need the web env, run via `notebooks-web`)" }
test-3d = { cmd = "pytest -vvv tests/three_d tests/base/test_renderer_conformance.py -m 'not image3d' --cov=src/digitalearth --cov-report=xml", description = """
    Run the 3-D (PyVista) tier tests — run in the viz3d env (`pixi run -e viz3d test-3d`). The `image3d`
    baselines are deselected; they run in `test-3d-images`. The shared renderer contract
    (tests/base/test_renderer_conformance.py) is collected here too: its 3-D class is gated on pyvista, and
    this is the only job with it, so leaving it to the `main` matrix skipped every check the 3-D tier signs
    (review M6). The web tier gets the same coverage by hosting its adapter beside its own tests
""" }
test-3d-images = { cmd = "pytest -vvv tests/three_d -m image3d --image3d-compare", description = """
    Compare the 3-D renders against the committed baselines in tests/baseline3d. Run in the viz3d env under a
    virtual display, on the Linux image the baselines were rendered on
""" }
test-3d-images-generate = { cmd = "pytest tests/three_d -m image3d --image3d-generate", description = """
    Regenerate every tests/baseline3d PNG from the current rendering, on the CI image — review the image diff
    before committing
""" }
notebooks-3d = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples/pyvista", description = "check the 3-D (PyVista) notebooks — run in the viz3d env (`pixi run -e viz3d notebooks-3d`)" }
test-interactive = { cmd = "pytest -vvv tests/interactive tests/base/test_renderer_conformance.py tests/base/test_map_conformance.py --cov=src/digitalearth --cov-report=xml", description = "Run the interactive (HoloViz) tier tests — run in the interactive env (`pixi run -e interactive test-interactive`). The two shared contracts under tests/base are collected here too: the renderer contract (tests/base/test_renderer_conformance.py) and the map conformance suite (tests/base/test_map_conformance.py). Both gate their interactive class on geoviews, and this is the only job with it, so leaving them to the `main` matrix skipped every check the interactive tier signs (review M6)" }
notebooks-interactive = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples/interactive", description = "check the interactive (HoloViz) notebooks — run in the interactive env (`pixi run -e interactive notebooks-interactive`). Notebooks 01/06/07 guard their WorldClim cells (in the gitignored examples/data/global/) — they render locally when present and skip otherwise." }
test-web = { cmd = "pytest -vvv tests/web tests/base/test_map_conformance.py --cov=src/digitalearth --cov-report=xml", description = "Run the web (MapLibre + deck.gl) tier tests — run in the web env (`pixi run -e web test-web`). The map conformance suite (tests/base/test_map_conformance.py) is collected here too: its web class is gated on maplibre, and this is the only job with it, so leaving it to the `main` matrix would skip every behavioural check the web tier signs (review M6). The renderer contract needs no such line — the web tier hosts its adapter in tests/web/test_web_seam.py instead" }
test-backends = { cmd = "pytest -vvv tests/base/test_backends_coexist.py tests/base/test_map_conformance.py --cov=src/digitalearth --cov-report=xml", description = """
    Run the cross-backend checks in the `all` env (`pixi run -e all test-backends`) — the only env that
    carries MapLibre, HoloViz and PyVista at once. It proves the three engines load together (a solve
    only proves their versions are compatible), and it runs the map conformance suite with BOTH 2-D tier
    classes live in one process, where every other job can collect only one of them
""" }
notebooks-web = { cmd = "pytest --nbval --nbval-lax --verbose docs/examples/web", description = "check the web (MapLibre + deck.gl) notebooks — run in the web env (`pixi run -e web notebooks-web`)" }
jupyter = { cmd = "jupyter lab --no-browser --IdentityProvider.token='' --ServerApp.password='' --port=8889", description = "launch jupyter lab" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
docs-serve = { cmd = "mkdocs serve", description = "Serve the documentation locally" }
docs-build = { cmd = "mkdocs build", description = "Build the documentation site" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }
lint = { depends-on = ["lint-names", "lint-format", "lint-imports"], description = "the CI lint gate: name-check (F821) across src/tests/docs, plus the formatter and import sorter over src/tests" }
lint-names = { cmd = "ruff check --select F821 src tests docs", description = "name-check every module and notebook (ruff F821) — catches an undefined name in a cell CI cannot execute. Scoped to F821, and to src/tests/docs, because the full ruleset and examples/ carry pre-existing findings" }
lint-format = { cmd = "ruff format --check src tests", description = "the formatter the repo configures and pre-commit runs. Gated here so the tree cannot drift from its own config again (#171); scoped to src/tests because docs/ notebooks and examples/ are not formatted" }
lint-imports = { cmd = "ruff check --select I src tests", description = "import sorting (isort). Split from lint-names because the rest of the ruleset (E/F/W/UP) still carries a pre-existing backlog and cannot be gated yet" }
doctests = { cmd = "pytest --doctest-modules src --ignore=src/digitalearth/interactive --ignore=src/digitalearth/three_d --ignore=src/digitalearth/web -p no:cacheprovider", description = "run the doctests in src. The three engine-backed tiers are ignored — their examples need holoviews/geoviews, pyvista and maplibre, which only the interactive/viz3d/web envs have; run them via `doctests-interactive`, `doctests-3d` and `doctests-web`" }
doctests-interactive = { cmd = "pytest --doctest-modules src/digitalearth/interactive -p no:cacheprovider", description = "run the interactive (HoloViz) doctests, which the `doctests` task ignores because they import holoviews/geoviews. Needs the interactive env" }
doctests-3d = { cmd = "pytest --doctest-modules src/digitalearth/three_d -p no:cacheprovider", description = "run the three_d doctests, which the `doctests` task ignores because they import pyvista. Needs the viz3d env" }
doctests-web = { cmd = "pytest --doctest-modules src/digitalearth/web -p no:cacheprovider", description = "run the web (MapLibre + deck.gl) doctests, which the `doctests` task ignores because they import maplibre. Needs the web env" }


# numba (pulled by datashader in the interactive tier) caps numpy at <2.5; conda-forge otherwise resolves
# numpy 2.5.x for the interactive solve-group, which leaves no installable numba, so uv backtracks numba into
# a legacy llvmlite that has no cp313 wheel and whose setup.py refuses Python >=3.10. Cap numpy here and scope
# this feature to the interactive env only, so the lean envs stay on the latest numpy.
[tool.pixi.feature.numba-numpy.dependencies]
numpy = "<2.5"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
# 3D tier (PyVista). Uses the `3d` feature that pixi derives from the `[3d]` optional-dependencies extra.
# Separate solve-group so VTK stays out of the lean default/dev envs. Run: pixi run -e viz3d test-3d
viz3d = { features = ["dev", "3d"], solve-group = "viz3d" }
# Interactive tier (HoloViz). Uses the `interactive` feature pixi derives from the `[interactive]` extra.
# Separate solve-group so geoviews/datashader/panel stay out of default/dev. Run: pixi run -e interactive test-interactive
interactive = { features = ["dev", "interactive", "numba-numpy"], solve-group = "interactive" }
# Web tier (MapLibre + deck.gl). Uses the `web` feature pixi derives from the `[web]` extra. Separate solve-group
# so maplibre stays out of default/dev. Run: pixi run -e web test-web
web = { features = ["dev", "web"], solve-group = "web" }
# Every backend in one environment, so a test can build the same figure on two tiers and compare them
# live. Deliberately its own solve-group: it is the only env where VTK, the HoloViz stack and MapLibre
# are resolved together, and it must not be able to move the single-backend envs' versions.
all = { features = ["dev", "3d", "interactive", "web", "numba-numpy"], solve-group = "all" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }


# NOTE: the `interactive` (HoloViz), `3d` (PyVista) and `web` (MapLibre + deck.gl) features are NOT declared here —
# pixi derives them automatically from the `[project.optional-dependencies]` `interactive` / `3d` / `web` extras
# above, and the `interactive` / `viz3d` / `web` envs reference them directly. Re-declaring them as pixi features
# double-declares every package and breaks `pixi update` ("<pkg> is already a dependency").

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.dependencies]
# Cap Python below 3.14 for the unpinned envs (default/dev/docs/notebook):
# 3.14 is outside the supported range and many GIS deps (gdal, pyproj, ...) have
# no 3.14 wheels yet, forcing source builds. py311/py312/py313 override this.
python = ">=3.11,<3.14"
gdal = ">=3.13.0,<4"
# Conda-forge's geopandas-base no longer pulls in a vector-IO backend.
# pyogrio is required for GeoDataFrame.to_file / read_file.
pyogrio = ">=0.12.1"
