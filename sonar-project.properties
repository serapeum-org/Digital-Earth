# SonarCloud configuration for Digital-Earth.
#
# The scan runs from CI (.github/workflows/sonarcloud.yml) after the test suite produces coverage.xml.
# projectKey / organization must match the project bound on https://sonarcloud.io (under the serapeum-org org).
# Override them here if SonarCloud auto-generated different keys when the project was imported.

sonar.projectKey=serapeum-org_Digital-Earth
sonar.organization=serapeum-org

# --- what to analyse ---
sonar.sources=src/digitalearth
sonar.tests=tests

# Python versions the package supports (drives language-version-specific rules).
sonar.python.version=3.11,3.12,3.13

# --- coverage ---
# coverage.xml is produced by `pixi run -e <env> main` (pytest --cov=src/digitalearth --cov-report=xml)
# with relative_files=true (see [tool.coverage.run] in pyproject.toml), so its paths resolve under sonar.sources.
sonar.python.coverage.reportPaths=coverage.xml

# --- exclusions ---
# Generated/scratch/doc trees that are not product code.
sonar.exclusions=docs/**,planning/**,examples/**,site/**,**/__pycache__/**,**/*.ipynb
# Tests and the deprecated legacy entry point are not held to coverage targets.
sonar.coverage.exclusions=tests/**,src/digitalearth/static.py

# Encoding of the source files.
sonar.sourceEncoding=UTF-8
