site_name: Digital-Earth
site_description: Geospatial visualization package for rasters and vector data
site_url: https://serapeum-org.github.io/Digital-Earth/
repo_url: https://github.com/serapeum-org/Digital-Earth
repo_name: serapeum-org/Digital-Earth

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  primary: indigo
  accent: indigo
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - panzoom:
      hint_location: "top"
      key: "ctrl"
      full_screen: true
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
  # The plot gallery moved from examples/plots/ to examples/static/ in this release. Every version
  # mike has published carries the old paths, so each one is redirected to its new home rather
  # than left to 404. Only the 26 pages that were actually published are listed; the notebooks
  # added in the same release never had an old URL. The source key is the OLD url as a .md path
  # (plugin maps 'a/b.md' -> a/b/index.html, the directory-url shape these pages were served at);
  # the target stays .ipynb because that is the real page mkdocs-jupyter registers.
  - redirects:
      redirect_maps:
        'examples/plots/01_imshow.md': 'examples/static/01_imshow.ipynb'
        'examples/plots/02_contourf.md': 'examples/static/02_contourf.ipynb'
        'examples/plots/03_contour.md': 'examples/static/03_contour.ipynb'
        'examples/plots/04_pcolormesh.md': 'examples/static/04_pcolormesh.ipynb'
        'examples/plots/05_block.md': 'examples/static/05_block.ipynb'
        'examples/plots/06_grid_points.md': 'examples/static/06_grid_points.ipynb'
        'examples/plots/07_scatter.md': 'examples/static/07_scatter.ipynb'
        'examples/plots/08_grid_cells.md': 'examples/static/08_grid_cells.ipynb'
        'examples/plots/09_quiver.md': 'examples/static/09_quiver.ipynb'
        'examples/plots/10_streamplot.md': 'examples/static/10_streamplot.ipynb'
        'examples/plots/11_barbs.md': 'examples/static/11_barbs.ipynb'
        'examples/plots/12_tricontourf.md': 'examples/static/12_tricontourf.ipynb'
        'examples/plots/13_tricontour.md': 'examples/static/13_tricontour.ipynb'
        'examples/plots/14_tripcolor.md': 'examples/static/14_tripcolor.ipynb'
        'examples/plots/15_rgb_composite.md': 'examples/static/15_rgb_composite.ipynb'
        'examples/plots/16_hsv_composite.md': 'examples/static/16_hsv_composite.ipynb'
        'examples/plots/17_choropleth.md': 'examples/static/17_choropleth.ipynb'
        'examples/plots/18_shapes.md': 'examples/static/18_shapes.ipynb'
        'examples/plots/19_spaghetti.md': 'examples/static/19_spaghetti.ipynb'
        'examples/plots/20_envelope.md': 'examples/static/20_envelope.ipynb'
        'examples/plots/21_quantile_band.md': 'examples/static/21_quantile_band.ipynb'
        'examples/plots/22_boxplot.md': 'examples/static/22_boxplot.ipynb'
        'examples/plots/23_multiboxplot.md': 'examples/static/23_multiboxplot.ipynb'
        'examples/plots/24_stripes.md': 'examples/static/24_stripes.ipynb'
        'examples/plots/25_timeseries.md': 'examples/static/25_timeseries.ipynb'
        'examples/plots/26_climatology.md': 'examples/static/26_climatology.ipynb'
  - table-reader
  - tags
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Plot raster/array: plotarray.md
  - Examples:
    - Sources (data wrapper): examples/01_sources.ipynb
    - Maps & raster fields: examples/02_maps_and_fields.ipynb
    - Points, cells & vectors: examples/03_points_cells_vectors.ipynb
    - RGB/HSV composites & mesh: examples/04_composites_and_mesh.ipynb
    - Choropleth & decoration: examples/05_choropleth_and_decoration.ipynb
    - Temporal & series: examples/06_temporal_and_series.ipynb
    - One-call quickplot: examples/07_quickplot.ipynb
    - Projected & globe maps: examples/08_projected_globe_maps.ipynb
    - Globe base maps (ocean/land): examples/09_globe_basemaps.ipynb
    - Globe internals (under the hood): examples/10_globe_under_the_hood.ipynb
    - Global data on the globe: examples/11_global_data_on_globe.ipynb
    - Animating data on the globe: examples/12_animated_globe.ipynb
    - Charts & map decorations: examples/13_charts_and_decorations.ipynb
    - Textured 3-D globe: examples/14_textured_globe_3d.ipynb
    - Managing layers: examples/15_layer_management.ipynb
    - Framing, viewports & insets: examples/16_framing_and_insets.ipynb
    - Multi-panel figures: examples/17_multi_panel_figures.ipynb
    - Global decorations (night, Tissot, tiles): examples/18_global_decorations.ipynb
    - Presets & styling:
      - Preset library gallery: examples/presets/01_preset_gallery.ipynb
      - Domain presets on matching data: examples/presets/02_domain_presets.ipynb
      - Palettes & colormaps: examples/presets/03_palettes_and_colormaps.ipynb
      - Colour scaling & terrain: examples/presets/04_color_scaling_and_terrain.ipynb
      - Globe & projections (real climate data): examples/presets/05_globe_and_projections.ipynb
    - Interactive web maps (HoloViz):
      - Overview — InteractiveMap: examples/interactive/00_overview.ipynb
      - Raster fields: examples/interactive/01_raster_fields.ipynb
      - Vector layers: examples/interactive/02_vector_layers.ipynb
      - Basemaps & decoration: examples/interactive/03_basemaps_and_decoration.ipynb
      - Flow fields & networks: examples/interactive/04_flow_and_networks.ipynb
      - Meshes & density: examples/interactive/05_mesh_and_density.ipynb
      - Big data (Datashader/COG): examples/interactive/06_big_data.ipynb
      - Time cubes & projections: examples/interactive/07_temporal_and_projections.ipynb
      - Interaction & dashboards: examples/interactive/08_interaction_and_dashboards.ipynb
    - 3-D visualization (PyVista):
      - Overview (all plot types): examples/pyvista/15_3d_visualization.ipynb
      - Scene3D — the 3-D host: examples/pyvista/01_scene3d_basics.ipynb
      - Terrain — DEMs as relief: examples/pyvista/02_terrain.ipynb
      - Point clouds: examples/pyvista/03_point_cloud.ipynb
      - Volumes & isosurfaces: examples/pyvista/04_volume_isosurface.ipynb
      - Vectors & extruded polygons: examples/pyvista/05_vectors_extruded.ipynb
      - Globe — data on a sphere: examples/pyvista/06_globe.ipynb
      - Animation — orbit & fly-through: examples/pyvista/07_animation.ipynb
      - 'GIS data — rasters in 3-D': examples/pyvista/08_raster_3d.ipynb
      - 'GIS data — vectors in 3-D': examples/pyvista/09_vector_3d.ipynb
      - 'GIS data — combined raster + vector scene': examples/pyvista/10_gis_scene_3d.ipynb
    # The gallery's labels are the *method* vocabulary; its filenames are the *render* vocabulary — the
    # `kind=`/`via` token each notebook demonstrates (`imshow`, `contour`, `contourf`, `scatter`, `shapes`,
    # and `pcolormesh`, `quiver`, `tricontourf`, … beside them). Those tokens are all live, so the five that
    # read like deleted method spellings are not stale (review N4): they are not being read as methods.
    # Renaming them would mix two vocabularies inside one numbered set, force `contour`/`contourf` to share
    # one word, and change published URLs. The labels below are where the method names belong.
    - Static gallery:
      - Fields:
        - field: examples/static/01_imshow.ipynb
        - contours (filled): examples/static/02_contourf.ipynb
        - contours: examples/static/03_contour.ipynb
        - pcolormesh: examples/static/04_pcolormesh.ipynb
        - block: examples/static/05_block.ipynb
      - Points & cells:
        - grid_points: examples/static/06_grid_points.ipynb
        - points: examples/static/07_scatter.ipynb
        - grid_cells: examples/static/08_grid_cells.ipynb
      - Vector fields:
        - quiver: examples/static/09_quiver.ipynb
        - streamplot: examples/static/10_streamplot.ipynb
        - barbs: examples/static/11_barbs.ipynb
      - Mesh (unstructured):
        - tricontourf: examples/static/12_tricontourf.ipynb
        - tricontour: examples/static/13_tricontour.ipynb
        - tripcolor: examples/static/14_tripcolor.ipynb
      - Composites:
        - rgb_composite: examples/static/15_rgb_composite.ipynb
        - hsv_composite: examples/static/16_hsv_composite.ipynb
      - Polygons:
        - choropleth: examples/static/17_choropleth.ipynb
        - polygons: examples/static/18_shapes.ipynb
        - cartogram: examples/static/31_cartogram.ipynb
      - Point aggregation:
        - voronoi: examples/static/27_voronoi.ipynb
        - quadtree: examples/static/28_quadtree.ipynb
        - hexbin: examples/static/29_hexbin.ipynb
        - kde: examples/static/30_kde.ipynb
      - Lines & flows:
        - lines: examples/static/32_lines.ipynb
        - sankey: examples/static/33_sankey.ipynb
      - Annotation:
        - labels: examples/static/34_labels.ipynb
      - Ensemble & series:
        - spaghetti: examples/static/19_spaghetti.ipynb
        - envelope: examples/static/20_envelope.ipynb
        - quantile_band: examples/static/21_quantile_band.ipynb
        - boxplot: examples/static/22_boxplot.ipynb
        - multiboxplot: examples/static/23_multiboxplot.ipynb
        - stripes: examples/static/24_stripes.ipynb
      - Temporal:
        - timeseries: examples/static/25_timeseries.ipynb
        - climatology: examples/static/26_climatology.ipynb
  - Reference:
    - Figure vocabulary: reference/vocabulary.md
    - Backend support matrix: reference/support-matrix.md
    - Maps (matplotlib): reference/static_map.md
    - Scenes & multi-panel figures (matplotlib): reference/static_scene.md
    - Interactive maps (HoloViz): reference/interactive_map.md
    - Web maps: reference/web_map.md
    - 3-D scenes (PyVista): reference/three_d.md
    - Keyed basemaps: reference/basemaps.md
    - TexturedGlobe (3-D globe): reference/textured_globe.md
    - Headless 3-D rendering: reference/headless_3d.md
    - Saving animations: reference/animation.md
    - Composite stretch: reference/stretch.md
  - About:
    - Change-log: change-log.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Contributing: contributing.md
    - License: LICENSE.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serapeum-org/Digital-Earth
  version:
      provider: mike
      version_selector: true
