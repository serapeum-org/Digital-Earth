site_name: Digital-Earth
site_description: Geospatial visualization package for rasters and vector data
site_url: https://serapeum-org.github.io/Digital-Earth/
repo_url: https://github.com/serapeum-org/Digital-Earth
repo_name: serapeum-org/Digital-Earth

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - search.highlight
    - search.suggest
    - toc.follow
    - announce.dismiss
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: lime
    toggle:
      icon: material/weather-night
      name: Switch to system preference
  primary: indigo
  accent: indigo
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - panzoom:
      hint_location: "top"
      key: "ctrl"
      full_screen: true
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
  - table-reader
  - tags
  - mike:
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"
      toc_depth: 1-4
      anchorlink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Plot raster/array: plotarray.md
  - Examples:
    - Sources (data wrapper): examples/01_sources.ipynb
    - Maps & raster fields: examples/02_maps_and_fields.ipynb
    - Points, cells & vectors: examples/03_points_cells_vectors.ipynb
    - RGB/HSV composites & mesh: examples/04_composites_and_mesh.ipynb
    - Choropleth & decoration: examples/05_choropleth_and_decoration.ipynb
    - Temporal & series: examples/06_temporal_and_series.ipynb
    - One-call quickplot: examples/07_quickplot.ipynb
    - Projected & globe maps: examples/08_projected_globe_maps.ipynb
    - Globe base maps (ocean/land): examples/09_globe_basemaps.ipynb
    - Globe internals (under the hood): examples/10_globe_under_the_hood.ipynb
    - Global data on the globe: examples/11_global_data_on_globe.ipynb
    - Animating data on the globe: examples/12_animated_globe.ipynb
    - Charts & map decorations: examples/13_charts_and_decorations.ipynb
    - 3-D visualization (PyVista):
      - Overview (all plot types): examples/pyvista/15_3d_visualization.ipynb
      - Scene3D — the 3-D host: examples/pyvista/01_scene3d_basics.ipynb
      - Terrain — DEMs as relief: examples/pyvista/02_terrain.ipynb
      - Point clouds: examples/pyvista/03_point_cloud.ipynb
      - Volumes & isosurfaces: examples/pyvista/04_volume_isosurface.ipynb
      - Vectors & extruded polygons: examples/pyvista/05_vectors_extruded.ipynb
      - Globe — data on a sphere: examples/pyvista/06_globe.ipynb
      - Animation — orbit & fly-through: examples/pyvista/07_animation.ipynb
    - Plot gallery:
      - Fields:
        - imshow: examples/plots/01_imshow.ipynb
        - contourf: examples/plots/02_contourf.ipynb
        - contour: examples/plots/03_contour.ipynb
        - pcolormesh: examples/plots/04_pcolormesh.ipynb
        - block: examples/plots/05_block.ipynb
      - Points & cells:
        - grid_points: examples/plots/06_grid_points.ipynb
        - scatter: examples/plots/07_scatter.ipynb
        - grid_cells: examples/plots/08_grid_cells.ipynb
      - Vector fields:
        - quiver: examples/plots/09_quiver.ipynb
        - streamplot: examples/plots/10_streamplot.ipynb
        - barbs: examples/plots/11_barbs.ipynb
      - Mesh (unstructured):
        - tricontourf: examples/plots/12_tricontourf.ipynb
        - tricontour: examples/plots/13_tricontour.ipynb
        - tripcolor: examples/plots/14_tripcolor.ipynb
      - Composites:
        - rgb_composite: examples/plots/15_rgb_composite.ipynb
        - hsv_composite: examples/plots/16_hsv_composite.ipynb
      - Polygons:
        - choropleth: examples/plots/17_choropleth.ipynb
        - shapes: examples/plots/18_shapes.ipynb
      - Ensemble & series:
        - spaghetti: examples/plots/19_spaghetti.ipynb
        - envelope: examples/plots/20_envelope.ipynb
        - quantile_band: examples/plots/21_quantile_band.ipynb
        - boxplot: examples/plots/22_boxplot.ipynb
        - multiboxplot: examples/plots/23_multiboxplot.ipynb
        - stripes: examples/plots/24_stripes.ipynb
      - Temporal:
        - timeseries: examples/plots/25_timeseries.ipynb
        - climatology: examples/plots/26_climatology.ipynb
  - Reference:
    - StaticGlyph: reference/static.md
  - About:
    - Change-log: change-log.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Contributing: contributing.md
    - License: LICENSE.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/serapeum-org/Digital-Earth
  version:
      provider: mike
      version_selector: true
