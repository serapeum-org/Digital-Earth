name: pypi-release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['github-release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Run on a manual dispatch, or automatically once github-release succeeds. The fork guard keeps the
    # PYPI_PUBLISH secret from ever reaching a workflow_run that originated outside this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.fork == false)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # head_branch (not head_sha): github-release pushes the version bump + lockfile-sync commits to the
          # branch tip after the run's head_sha is captured, and we need those to publish the bumped version.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Build and publish to PyPI
        uses: serapeum-org/github-actions/actions/release/pypi@65da263cc0f804cba87da3cbe6024d528831be1d # pypi-release/v1.0.1
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          package-manager: 'pixi'
          install-groups: 'dev'
          verify-lock: 'false'
