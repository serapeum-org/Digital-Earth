name: pypi-release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['github-release']
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by download-artifact to fetch the release-ref artifact from the github-release run (cross-run).
      actions: read
    # Run on a manual dispatch, or automatically once github-release succeeds. The fork guard keeps the
    # PYPI_PUBLISH secret from ever reaching a workflow_run that originated outside this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.fork == false)
    steps:
      - name: Download the release ref from the github-release run
        # On the workflow_run (release) path, github-release cut the version bump + lockfile commit on the
        # release branch and uploaded its name as the `release-ref` artifact. Fetch it so we publish the tree
        # that actually holds the bump -- not head_branch, which is the dispatched ref, not necessarily that
        # branch. A dispatch run of this workflow skips this and falls back to github.ref_name below.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-ref
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .release-ref

      - name: Resolve the ref to publish
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          FALLBACK_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REF="$(cat .release-ref/release-ref.txt)"
          else
            REF="$FALLBACK_REF"
          fi
          echo "resolved ref: ${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Build and publish to PyPI
        uses: serapeum-org/github-actions/actions/release/pypi@65da263cc0f804cba87da3cbe6024d528831be1d # pypi-release/v1.0.1
        with:
          pypi-username: __token__
          pypi-password: ${{ secrets.PYPI_PUBLISH }}
          package-manager: 'pixi'
          install-groups: 'dev'
          verify-lock: 'false'
