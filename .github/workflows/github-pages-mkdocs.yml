name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

# The docs build EXECUTES every notebook under docs/examples/ before rendering (notebooks-path), so the
# published pages show freshly-run outputs instead of whatever was committed. That is why the `docs` pixi
# env carries all three rendering tiers - see the comment on it in pyproject.toml. The action caches
# executed notebooks in .jupyter_cache, keyed on the notebooks plus src/**/*.py and pyproject.toml, so a
# source change re-runs the whole set on the next deploy.
jobs:
  # Gate every deploy on a warnings-as-errors build. The mkdocs-deploy action builds non-strict, so a
  # broken nav entry, a dangling anchor or a malformed docstring would publish silently - this fails the
  # run instead. mkdocstrings imports the documented modules at build time, so the gate needs the `docs`
  # env's full rendering stack (3d / interactive / web); mkdocs.yml sets mkdocs-jupyter `execute: false`,
  # so the notebooks render from their committed outputs and no kernel (hence no xvfb/OpenGL) is needed
  # here - unlike the deploy jobs, which re-execute them.
  build-strict:
    # Skip on a FAILED (or cancelled) upstream github-release: such a run never reached the upload step, so
    # there is no release-ref artifact, and this job would spend a full docs build gating the wrong tree.
    # `workflow_run: types: [completed]` fires whatever the conclusion, and this was the only consumer
    # without the guard the deploy / publish jobs already carry. Every non-workflow_run event (push /
    # pull_request / release) still runs unconditionally.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Only reads the tree; the write scopes the workflow grants are for the deploy jobs, not for this one.
    permissions:
      contents: read
      # download the release-ref artifact on the workflow_run path (cross-run)
      actions: read
    steps:
    - name: Download the release ref from the github-release run
      # Gate the SAME tree the deploy jobs publish: on workflow_run / release that is the release branch / tag
      # (the bump + new changelog), not pre-bump main -- else a page that only exists on the release branch
      # would pass --strict yet still publish. On push / pull_request this is skipped and checkout uses its
      # default ref (the PR merge commit), so fork-controlled code never reaches a write-scoped job.
      # continue-on-error: a draft release (which concludes `success`, so the job guard above does not skip
      # it) uploads no artifact; let the job continue and have the resolve step fall back to gating the
      # default tree instead of erroring here.
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-ref
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .release-ref

    - name: Resolve the ref to gate
      id: ref
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        case "$EVENT_NAME" in
          workflow_run)
            # No artifact => a draft release, or a run that never reached the upload. Nothing was published,
            # so there is no released tree to gate: fall back to the default tree (harmless, stays green)
            # rather than erroring. A present-but-empty ref is corruption and still hard-errors.
            if [ -f .release-ref/release-ref.txt ]; then
              REF="$(cat .release-ref/release-ref.txt)"
              # Shape, not mere non-emptiness: the producer writes `git rev-parse HEAD`, so a valid token
              # is 40 hex characters. `-n` alone admits a blank ref, which checkout trims away and
              # resolves to the default branch -- gating a tree nobody is publishing.
              case "$REF" in
                "" | *[!0-9a-f]*) echo "::error::malformed release ref '$REF'"; exit 1 ;;
              esac
              [ "${#REF}" -eq 40 ] || { echo "::error::release ref '$REF' is not a 40-char commit SHA"; exit 1; }
            else
              echo "no release-ref artifact (draft or non-publishing run); gating the default tree"
              REF=""
            fi ;;
          release) REF="$RELEASE_REF" ;;
          *) REF="" ;;
        esac
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ steps.ref.outputs.ref }}

    # The same environment the deploy jobs get: mkdocs-deploy calls this action internally with these
    # inputs, so reusing it here keeps the gate and the deploy on one environment instead of letting a
    # hand-installed toolchain drift from the one that actually publishes.
    - uses: serapeum-org/github-actions/actions/python-setup/pixi@71653ea9fc52dff9166b270614a41d7e42b3453a # pixi/v1.3.0
      with:
        environments: 'docs'
        activate-environment: 'docs'
        version: 'v0.73.0'
        verify-lock: false
        # Explicit (pixi/v1.3.0 flips the default to true): match the other pixi steps rather than let a
        # dependency bump silently change the gate's caching.
        cache: true

    - name: Build docs with --strict
      run: pixi run -e docs docs-build-strict --site-dir /tmp/site

    # A pull request builds the site but no longer publishes it (#533): each PR deploy was a full site
    # commit on the shared `gh-pages` branch, and those commits are what grew the branch to 1,270 commits
    # and the repository past 10 GB. The --strict build above is the gate, and reviewers who want to look
    # at the rendered pages download them from here instead of visiting a published preview.
    - name: Upload the built site for review
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: site-pr-${{ github.event.pull_request.number }}
        path: /tmp/site
        retention-days: 7

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-strict
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
    - name: Virtual framebuffer + software OpenGL (so the 3-D notebooks render during the build)
      run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'main'
        package-manager: 'pixi'
        package-manager-version: 'v0.73.0'
        install-groups: 'docs'
        notebooks-path: 'docs/examples'
        # Excluded from the execution, so these render from their committed outputs:
        #   - 18_global_decorations draws a basemap(), which pulls XYZ tiles from a live service.
        #   - web/web_maps is a web-tier MapLibre notebook, absent from the nav; excluded so the
        #     deploy does not execute a browser-dependent page that is not published anyway.
        # Everything else executes. The one other notebook that reaches a tile service,
        # 14_textured_globe_3d, falls back to committed data if the fetch fails, so a deploy is
        # never blocked by a third-party host being down.
        notebooks-exclude: |
          18_global_decorations.ipynb
          web/web_maps.ipynb
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    # Security: when triggered via `workflow_run`, require that the upstream
    # workflow ran from the base repository (not a fork) so we can never run
    # untrusted code in a context that holds `ACTIONS_DEPLOY_TOKEN`.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)
    needs: build-strict
    runs-on: ubuntu-latest
    # Serialize release-docs deploys so two runs never race on gh-pages (mike deploy + prune). A UI/PAT-
    # published release fires BOTH the `release` and `workflow_run` events; a constant group makes the second
    # wait instead of corrupting the branch. The bot path fires only workflow_run, so this is normally a no-op.
    concurrency:
      group: mkdocs-deploy-release
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      # Download the release-ref artifact from the github-release run (cross-run fetch).
      actions: read
    steps:
    - name: Download the release ref from the github-release run
      # github-release cuts the version bump + tag on the release branch, not on the dispatch ref, so on the
      # workflow_run path head_sha/head_branch point at pre-bump main. Fetch the released commit SHA it
      # recorded and deploy from there, so the versioned docs reflect the released version -- the same
      # release-ref handoff pypi-release uses. (Without it, deploy-release publishes OLD docs + regresses
      # `latest`.)
      # continue-on-error: a draft release uploads no artifact; the resolve step reads that absence as
      # "nothing to deploy" and skips the checkout, the deploy and the prune rather than erroring here.
      if: github.event_name == 'workflow_run'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-ref
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: .release-ref

    - name: Resolve the ref to deploy
      id: ref
      env:
        EVENT_NAME: ${{ github.event_name }}
        # Fallback serves the `release` event, where github.ref is refs/tags/<tag> (the released tag).
        FALLBACK_REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "workflow_run" ]; then
          # No artifact => github-release withheld it (a draft release), or the run never reached the
          # upload. Nothing was published, so there are no versioned docs to deploy and no `latest` alias
          # to move: skip cleanly rather than erroring on the file.
          if [ ! -f .release-ref/release-ref.txt ]; then
            echo "no release-ref artifact (draft or non-publishing run); skipping the release deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="$(cat .release-ref/release-ref.txt)"
          # Shape, not mere non-emptiness: the producer writes `git rev-parse HEAD`, so a valid token is
          # 40 hex characters. `-n` alone admits a blank ref, which checkout trims away and resolves to
          # the default branch -- deploying pre-bump main as the released version and moving `latest`
          # onto it, which is what this guard exists to refuse.
          case "$REF" in
            "" | *[!0-9a-f]*) echo "::error::malformed release ref '$REF' -- refusing to deploy the default branch"; exit 1 ;;
          esac
          [ "${#REF}" -eq 40 ] || { echo "::error::release ref '$REF' is not a 40-char commit SHA"; exit 1; }
        else
          REF="$FALLBACK_REF"
        fi
        echo "resolved ref: ${REF}"
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      if: steps.ref.outputs.skip != 'true'
      with:
        fetch-depth: 0
        # workflow_run: the released commit SHA from the release-ref artifact (the tree that holds the bump);
        # `release` event: the published tag. Both carry the released version. The release-ref SHA comes
        # from the gated, fork-guarded release run, so it is trusted input (CWE-829: untrusted-checkout) --
        # the fork guard in `if:` above keeps untrusted code out.
        ref: ${{ steps.ref.outputs.ref }}

    - name: Extract version from pyproject.toml
      id: version
      if: steps.ref.outputs.skip != 'true'
      # Anchor on `version` + `=` so it cannot match `version_provider` under [tool.commitizen]. On a
      # `release` event, assert the published tag_name equals the committed version so the deploy tag and the
      # prune floor (KEEP_VERSION) cannot diverge and prune the version just deployed (finding M2).
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        VERSION=$(grep -m1 '^version[[:space:]]*=' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        if [ -n "${TAG_NAME:-}" ] && [ "$TAG_NAME" != "$VERSION" ]; then
          echo "::error::release tag '$TAG_NAME' != pyproject version '$VERSION'"; exit 1
        fi
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Virtual framebuffer + software OpenGL (so the 3-D notebooks render during the build)
      if: steps.ref.outputs.skip != 'true'
      run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      if: steps.ref.outputs.skip != 'true'
      with:
        trigger: 'release'
        package-manager: 'pixi'
        package-manager-version: 'v0.73.0'
        install-groups: "docs"
        notebooks-path: 'docs/examples'
        # Excluded from the execution, so these render from their committed outputs:
        #   - 18_global_decorations draws a basemap(), which pulls XYZ tiles from a live service.
        #   - web/web_maps is a web-tier MapLibre notebook, absent from the nav; excluded so the
        #     deploy does not execute a browser-dependent page that is not published anyway.
        # Everything else executes. The one other notebook that reaches a tile service,
        # 14_textured_globe_3d, falls back to committed data if the fetch fails, so a deploy is
        # never blocked by a third-party host being down.
        notebooks-exclude: |
          18_global_decorations.ipynb
          web/web_maps.ipynb
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'

    # Retain `main` plus the RETAIN_RELEASES most recent releases, and delete anything else - older
    # releases, and the now-frozen `develop` that the removed PR deploy used to publish.
    #
    # Why a cap at all: each version directory is a full copy of the site (~170 MB here), so retaining
    # every release is what grew the published site to 2.74 GB across 16 directories. On earthlens the
    # same unbounded growth took its site to 9.7 GB, at which point GitHub Pages stopped building at all
    # and the current release's docs were silently never published. GitHub documents a 1 GB published-site
    # limit, but that is not the observed threshold (earthlens built fine at 1.39 GB); treat multi-GB as
    # the danger zone. If a release ever fails to publish, lower RETAIN_RELEASES before anything else.
    #
    # `main` is always retained: deploy-main republishes it on every push, so deleting it here would only
    # have it return minutes later.
    #
    # Auth comes from the checkout above, the same way the deploy's own pushes work. mike runs through
    # `pixi run -e docs` because the mkdocs-deploy step above installed that env earlier in this job.
    - name: Prune superseded documentation versions
      if: steps.ref.outputs.skip != 'true'
      env:
        KEEP_VERSION: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        RETAIN_RELEASES: '5'
      run: |
        if [ -z "$KEEP_VERSION" ]; then
          echo "::error::no release version resolved; refusing to prune"
          exit 1
        fi
        # Re-sync, recompute and retry as a unit: a concurrent main deploy moves gh-pages, which makes
        # mike's fast-forward push lose the race, and the stale list computed against the old tip must not
        # be reused.
        for attempt in 1 2 3; do
          git fetch origin gh-pages
          git branch -f gh-pages FETCH_HEAD

          pixi run -e docs docs-version-list | awk '{print $1}' | sort -u > /tmp/mike-all
          # `sort -V` is load-bearing: a lexical sort ranks 0.9.0 above 0.11.0 and would retain the wrong
          # five. Only X.Y.Z entries count as releases, so `develop` and any alias-only row fall through
          # to the delete set rather than consuming a retention slot.
          grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' /tmp/mike-all \
            | sort -rV | head -n "$RETAIN_RELEASES" > /tmp/mike-keep-releases
          # KEEP_VERSION is listed explicitly as a floor: the release that was just deployed must survive
          # even if it somehow sorts outside the top RETAIN_RELEASES.
          { echo main; echo "$KEEP_VERSION"; cat /tmp/mike-keep-releases; } \
            | grep -v '^$' | sort -u > /tmp/mike-keep
          stale=$(comm -23 /tmp/mike-all /tmp/mike-keep | tr '\n' ' ')

          if [ -z "$stale" ]; then
            echo "nothing to prune; retaining $(tr '\n' ' ' < /tmp/mike-keep)"
            exit 0
          fi
          echo "retaining $(tr '\n' ' ' < /tmp/mike-keep)"
          echo "deleting: $stale"
          if pixi run -e docs docs-version-delete $stale; then
            exit 0
          fi
          echo "::warning::prune lost a gh-pages push race (attempt ${attempt}/3); retrying"
          sleep $(( attempt * 3 ))
        done
        echo "::error::could not prune superseded documentation versions after 3 attempts"
        exit 1
