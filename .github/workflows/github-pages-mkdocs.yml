name: Deploy MkDocs

permissions:
  contents: write
  pages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  release:
      types:
        - published
  workflow_run:
    workflows: ['github-release']
    types: [completed]

# The docs build EXECUTES every notebook under docs/examples/ before rendering (notebooks-path), so the
# published pages show freshly-run outputs instead of whatever was committed. That is why the `docs` pixi
# env carries all three rendering tiers - see the comment on it in pyproject.toml. The action caches
# executed notebooks in .jupyter_cache, keyed on the notebooks plus src/**/*.py and pyproject.toml, so a
# source change re-runs the whole set on the next deploy.
jobs:
  deploy-pr:
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Virtual framebuffer + software OpenGL (so the 3-D notebooks render during the build)
        run: |
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
            Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
        with:
          trigger: 'pull_request'
          package-manager: 'pixi'
          package-manager-version: 'v0.73.0'
          install-groups: 'docs'
          notebooks-path: 'docs/examples'
          # Excluded from the execution, so these render from their committed outputs:
          #   - 18_global_decorations draws a basemap(), which pulls XYZ tiles from a live service.
          #   - web/web_maps is a web-tier MapLibre notebook, absent from the nav; excluded so the
          #     deploy does not execute a browser-dependent page that is not published anyway.
          # Everything else executes. The one other notebook that reaches a tile service,
          # 14_textured_globe_3d, falls back to committed data if the fetch fails, so a deploy is
          # never blocked by a third-party host being down.
          notebooks-exclude: |
            18_global_decorations.ipynb
            web/web_maps.ipynb
          deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
    - name: Virtual framebuffer + software OpenGL (so the 3-D notebooks render during the build)
      run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'main'
        package-manager: 'pixi'
        package-manager-version: 'v0.73.0'
        install-groups: 'docs'
        notebooks-path: 'docs/examples'
        # Excluded from the execution, so these render from their committed outputs:
        #   - 18_global_decorations draws a basemap(), which pulls XYZ tiles from a live service.
        #   - web/web_maps is a web-tier MapLibre notebook, absent from the nav; excluded so the
        #     deploy does not execute a browser-dependent page that is not published anyway.
        # Everything else executes. The one other notebook that reaches a tile service,
        # 14_textured_globe_3d, falls back to committed data if the fetch fails, so a deploy is
        # never blocked by a third-party host being down.
        notebooks-exclude: |
          18_global_decorations.ipynb
          web/web_maps.ipynb
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}

  deploy-release:
    # Security: when triggered via `workflow_run`, require that the upstream
    # workflow ran from the base repository (not a fork) so we can never run
    # untrusted code in a context that holds `ACTIONS_DEPLOY_TOKEN`.
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.head_repository.fork == false)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        fetch-depth: 0
        # Pin to the immutable SHA recorded on the originating run, not the
        # mutable `head_branch` label (CWE-829: actions/untrusted-checkout).
        ref: ${{ github.event.workflow_run.head_sha || github.ref }}

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
        echo "tag=$VERSION" >> $GITHUB_OUTPUT

    - name: Virtual framebuffer + software OpenGL (so the 3-D notebooks render during the build)
      run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

    - uses: serapeum-org/github-actions/actions/mkdocs-deploy@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # mkdocs/v1.3.1
      with:
        trigger: 'release'
        package-manager: 'pixi'
        package-manager-version: 'v0.73.0'
        install-groups: "docs"
        notebooks-path: 'docs/examples'
        # Excluded from the execution, so these render from their committed outputs:
        #   - 18_global_decorations draws a basemap(), which pulls XYZ tiles from a live service.
        #   - web/web_maps is a web-tier MapLibre notebook, absent from the nav; excluded so the
        #     deploy does not execute a browser-dependent page that is not published anyway.
        # Everything else executes. The one other notebook that reaches a tile service,
        # 14_textured_globe_3d, falls back to committed data if the fetch fails, so a deploy is
        # never blocked by a third-party host being down.
        notebooks-exclude: |
          18_global_decorations.ipynb
          web/web_maps.ipynb
        deploy-token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        release-tag: ${{ github.event.release.tag_name || steps.version.outputs.tag }}
        mike-alias: 'latest'
