name: SonarCloud

# Static analysis + coverage reporting to SonarQube Cloud (https://sonarcloud.io).
#
# Runs the full test suite ONCE in the `viz3d` pixi env (dev + the 3D extra, so the
# `digitalearth.three_d` tier actually executes rather than skipping), producing a
# repo-root-relative coverage.xml, then hands it to the Sonar scanner. Project key,
# organization, sources, and coverage path live in `sonar-project.properties`.
#
# Until SonarCloud is configured, the scan step is SKIPPED (not failed) when `SONAR_TOKEN` is absent, so this
# workflow stays green and never blocks a merge. It activates automatically once the secret is added.
#
# One-time manual setup to turn the scan on:
#   1. Import / create the project on SonarCloud under the `serapeum-org` org
#      (project key `serapeum-org_Digital-Earth` — adjust sonar-project.properties if it differs).
#   2. Add the repository secret `SONAR_TOKEN` (a SonarCloud "Analyze project" token).
#   3. Disable SonarCloud's "Automatic Analysis" for the project so this CI-based scan is used.

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch/PR cancels the previous in-progress Sonar run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    # Lift the secret to a job-level env so step `if:` conditions can test whether it is set (secrets are not
    # available directly in `if:` expressions, but the env context is).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history so SonarCloud can attribute new-code and blame correctly.
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@0894988f30f270ee8e0d9369f1f62a0deb8d5233 # pixi/v1.1.1
        with:
          environments: viz3d
          activate-environment: viz3d
          cache: true

      # The viz3d suite renders the 3-D tier off-screen through VTK's OpenGL, which still needs a display + a GL
      # driver even when off_screen=True (without one VTK segfaults). Install a virtual framebuffer and Mesa's
      # software GL, then run the suite under `xvfb-run`. Plain apt (no third-party action, which the org's
      # Actions policy blocks at workflow start-up).
      - name: Install a virtual framebuffer + software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Run tests with coverage
        # `main` = pytest --cov=src/digitalearth --cov-report=xml -> coverage.xml at the repo root.
        run: xvfb-run -a pixi run -e viz3d main

      - name: SonarCloud scan
        # Runs only once SONAR_TOKEN is configured; until then it is skipped so the check passes (see header).
        if: ${{ env.SONAR_TOKEN != '' }}
        # TODO: pin to a commit SHA to match this repo's action-pinning convention once selected.
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud scan skipped (no token)
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::notice title=SonarCloud::Scan skipped — repository secret SONAR_TOKEN is not set." \
               "Complete the one-time setup in .github/workflows/sonarcloud.yml to enable analysis."
