name: Lint

# The static gate that the test matrix (tests.yml) does not provide. tests.yml runs pytest + nbval across the
# OS/Python matrix and a scoped ruff/mypy/doctest step (lint-and-doctests), but nothing in CI runs the full
# pre-commit hook suite — so a formatting slip, a ruff violation the scoped gate does not select, a leaked
# secret, or a bandit/checkov/shellcheck finding could reach main unnoticed. This workflow closes that gap by
# running the hooks themselves, exactly as a contributor runs them locally. It stays out of tests.yml so a slow
# test leg never blocks the sub-two-minute lint feedback, and vice versa.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs the pre-commit hooks in CI: ruff (lint + format), the file/format/security checks, beautysh,
  # shellcheck, bandit, checkov — plus mypy, which needs the pixi `dev` env (typed deps + an importable
  # package), so this job installs that env and the mypy hook runs here. One runner, no matrix
  # (formatting/linting/typing are identical on every OS and Python version).
  #
  # SKIP drops the hooks CI runs elsewhere or that cannot run here: pytest-check, doctest and notebook-check
  # are the tests.yml matrix's job (running them here would duplicate it and pin to one Python);
  # no-commit-to-branch is a local commit guard that would misfire in CI, which legitimately runs on main;
  # gitleaks scans only staged changes (empty after a CI checkout), so it is inert in --all-files — the
  # dedicated `gitleaks` job below scans the whole tree.
  #
  # pixi-lock-check is deliberately out of CI scope: `pixi lock --check` re-solves against live conda/PyPI
  # channels, so it fails on *upstream* churn (a new build of an unrelated transitive dep), not just on our own
  # pyproject-vs-lock drift — that would make every PR flaky. Lock freshness stays enforced by the local
  # pixi-lock-check hook (scoped to pyproject.toml/pixi.lock edits) plus PR review.
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No fetch-depth: `pre-commit run --all-files` scans the working tree, not history.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The mypy hook shells out to `pixi run --frozen -e dev mypy`, so the dev env must exist here. Installs
      # pixi + the cached dev env (not activated — the hook selects the env explicitly with `-e dev`, and
      # leaving it unactivated keeps the system Python below as the one that runs pre-commit itself).
      - name: Set up pixi dev env
        uses: serapeum-org/github-actions/actions/python-setup/pixi@71653ea9fc52dff9166b270614a41d7e42b3453a # pixi/v1.3.0
        with:
          environments: dev
          cache: true
          version: v0.73.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Cache the hook toolchains (each hook repo builds an isolated env on first run). Keyed on the config so
      # a hook or rev bump rebuilds; restore-keys reuse the rest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      # Pin the resolved version (reproducible CI, and satisfies the supply-chain "lock resolved versions"
      # check); bump deliberately or via dependabot.
      # --only-binary=:all: installs from wheels only, so pip never runs a package's setup scripts.
      - run: "python -m pip install --only-binary=:all: pre-commit==4.5.1"

      - name: Run pre-commit hooks
        # --show-diff-on-failure prints exactly what the auto-fixers (ruff-format, end-of-file-fixer, ...)
        # would change, so a contributor sees the fix to apply.
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: no-commit-to-branch,gitleaks,pytest-check,doctest,notebook-check,pixi-lock-check

  # The repo's secret gate. The gitleaks pre-commit hook only scans staged changes, which are empty in CI, so
  # this job scans the whole working tree — every tracked file, notebooks included. This repo ships no
  # ci/gitleaks.toml, so the scan uses gitleaks' default ruleset, matching what the hook does locally.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Scan for secrets (gitleaks)
        # Pinned binary + SHA256 verification (avoids the gitleaks-action org-license requirement).
        # `gitleaks dir` exits non-zero on a leak, which fails the job.
        run: |
          VER=8.30.0
          SHA=79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          curl -sSL --proto '=https' --proto-redir '=https' -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --redact --no-banner
