name: Tests - Suite

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs: a new push to a branch/PR cancels the previous in-progress run
# instead of letting both compete for the (limited, especially macOS) hosted-runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        environment: [py311, py312, py313]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true
          version: v0.73.0

      - name: Run main tests
        run: |
          pixi run -e ${{ matrix.environment }} main

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5

  # The two cheap whole-tree checks: a static name-check, and the doctests. ruff's F821 analyses a
  # notebook as a whole, across cells, so it catches an undefined name inside a cell CI cannot execute
  # — a body guarded by
  # `if <gitignored data>.exists():`, or one of the network-heavy notebooks the `notebooks` job skips. Those cells are
  # dead code on a fresh clone, so no amount of notebook execution can cover them; this can, in about a second.
  # Scoped to F821 on src/tests/docs deliberately: the full ruleset has ~1000 pre-existing findings (mostly import
  # ordering) and examples/ is the exploratory scratch tree, both out of scope here. Keep the version in step with
  # the ruff-pre-commit rev in .pre-commit-config.yaml.
  lint-and-doctests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No fetch-depth: 0 — this job reads the working tree only, never history.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: dev
          activate-environment: dev
          cache: true
          version: v0.73.0

      - name: Name-check modules and notebooks
        # Through pixi, not a bare `pip install` into the runner's system Python: the version then comes from
        # pixi.lock rather than a second copy of it here, and a contributor can run the identical check with
        # `pixi run -e dev lint` before pushing. ruff lints .ipynb natively, no extra flag.
        run: |
          pixi run -e dev lint

      - name: Run the doctests
        # The five doctests this branch migrated by hand are the only migrated code no other job covers:
        # `main` sets testpaths = ["tests"] with no --doctest-modules, and ruff's F821 does not analyse
        # doctest bodies, so a missing import inside a `>>>` block would sail through the step above.
        run: |
          pixi run -e dev doctests

  # The notebook gallery (docs/examples + plots/ + presets/), rendered in the dev env, minus the two
  # network-heavy notebooks the step below names. Without this job nothing in CI executes those notebooks at
  # all: the tier jobs below each run only their own tier's task, and the docs build renders with
  # mkdocs-jupyter `execute: false`.
  notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No fetch-depth: 0 — this job reads the working tree only, never history.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: dev
          activate-environment: dev
          cache: true
          version: v0.73.0

      - name: Check the notebooks render
        # The gallery skip-list is declared once, as the `notebooks` task's ignore-globs. The pre-commit
        # notebook-check hook restates it as a regex because a hook filters paths, not pytest arguments;
        # tests/test_pixi_task_references.py asserts the two select exactly the same notebooks, so the
        # restatement cannot drift. The two globs below are neither of those: they are a CI-only delta,
        # appended to the task rather than forking it, because the reason is CI-specific — 11 and 12 each
        # download ~50 MB of WorldClim/ETOPO from real endpoints on every run (examples/data/global/ holds
        # only the tracked ersstv5.nc). The lint-and-doctests job name-checks those two instead.
        run: >
          pixi run -e dev notebooks
          --ignore-glob='docs/examples/11_global_data_on_globe.ipynb'
          --ignore-glob='docs/examples/12_animated_globe.ipynb'

  # The 3-D (PyVista) notebook needs VTK + the viz3d extra, so it is excluded from the default `notebooks`
  # task and validated here in the viz3d env. One Linux runner is enough — PyVista renders headless via OSMesa.
  notebooks-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: viz3d
          activate-environment: viz3d
          cache: true
          version: v0.73.0

      # PyVista renders off-screen through VTK's OpenGL, which still needs a display + a GL driver even when
      # off_screen=True (without one VTK segfaults). Install a virtual framebuffer and Mesa's software GL, then
      # run the render under `xvfb-run`. Done with plain apt (no third-party action, which the org's Actions
      # policy blocks) so the step can't be rejected at workflow start-up.
      - name: Install a virtual framebuffer + software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Check the 3-D notebook renders
        run: |
          xvfb-run -a pixi run -e viz3d notebooks-3d

  # Resolves the `3d` extra the way a user does — `pip install .[3d]` straight from PyPI, no pixi and no
  # lock — and then runs the one call that depends on the whole trame/vtk.js stack being right. Every other
  # 3-D job installs from pixi.lock, which pins pyvista 0.48.4, so without this the extra's own resolution is
  # never exercised and the >=0.49 arm of `Scene3DBase.export_html` runs only against a test stub. That is the
  # gap that let #158 happen: the extra hand-listed pyvista 0.48's trame packages, 0.49 moved them to
  # trame-pyvista, and nothing noticed until someone installed it.
  #
  # Deliberately unpinned, which means an upstream release can redden a PR that did not touch any of this.
  # That is the trade for catching the drift at all: the alternative — pinning — is what broke #158. When this
  # job alone is red, read "Report what the extra resolved to": if the versions moved, the break is upstream's
  # and belongs in its own fix, not in the PR that happened to run next.
  extra-3d-resolves:
    runs-on: ubuntu-latest
    steps:
      # No fetch-depth: 0 — this job installs the working tree and never reads history.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install a virtual framebuffer + software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Install the 3d extra from PyPI
        # --only-binary :all: keeps a dependency's setup script from running on this runner; every
        # package the extra resolves to publishes wheels, so it costs nothing here.
        run: |
          pip install --only-binary :all: ".[3d]" pyogrio

      - name: Report what the extra resolved to
        # Printed rather than asserted: which packages carry the export differs by pyvista version, and
        # pinning that here would recreate the hand-listed set this job exists to catch.
        run: |
          pip list | grep -Ei "pyvista|trame|vtk|nest.asyncio" || true

      - name: Export a scene through the resolved stack
        # `export_html` is the whole point: it is the only call that needs the trame/vtk.js stack, and the one
        # that raised `The "trame" plotter component is not registered` on a freshly resolved environment.
        # Three things are asserted, not just that it ran:
        #   - the page is written at the path export_html returned (round 1 shipped a version where it was not);
        #   - if trame-pyvista is installed its plotter component is registered — pyvista's registry turns a
        #     failing plugin import into a warning and drops the entry, which would silently demote us to the
        #     deprecated path this job exists to exercise;
        #   - no PyVistaDeprecationWarning was raised, i.e. we did not take that deprecated path after all.
        run: |
          xvfb-run -a python -c "
          import importlib.util, os, tempfile, warnings
          import pyvista as pv
          from digitalearth.three_d import Scene3D
          print('resolved pyvista', pv.__version__)
          pv.OFF_SCREEN = True
          with tempfile.TemporaryDirectory() as folder:
              scene = Scene3D(off_screen=True)
              scene.add_mesh(pv.Sphere())
              component = getattr(scene.plotter, 'trame', None)
              with warnings.catch_warnings(record=True) as caught:
                  warnings.simplefilter('always')
                  out = scene.export_html(os.path.join(folder, 'scene.html'))
              size = os.path.getsize(out)
              scene.close()
          print('component branch:', component is not None, '| exported', size, 'bytes')
          assert size > 0, 'export_html wrote an empty page'
          if importlib.util.find_spec('trame_pyvista') is not None:
              assert component is not None, 'trame-pyvista is installed but its component is not registered'
          stale = [str(w.message) for w in caught if 'PyVistaDeprecationWarning' in type(w.message).__name__]
          assert not stale, f'export went through a deprecated pyvista API: {stale}'
          "

  # The 3-D (PyVista) tier unit tests run in the viz3d env (the default py311/312/313 matrix lacks pyvista and
  # skips them). Same headless setup as notebooks-3d: VTK needs a virtual framebuffer + software GL even
  # off-screen. This is the only coverage for src/digitalearth/three_d/.
  tests-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: viz3d
          activate-environment: viz3d
          cache: true
          version: v0.73.0

      - name: Install a virtual framebuffer + software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Run 3-D tier tests
        run: |
          xvfb-run -a pixi run -e viz3d test-3d

      - name: Run the 3-D doctests
        # The `doctests` task ignores three_d because those modules import pyvista, which the dev env does
        # not have. Without this step their doctests would run in no job at all.
        run: |
          xvfb-run -a pixi run -e viz3d doctests-3d

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5

  # The interactive (HoloViz) tier needs the `interactive` extra (geoviews/holoviews/datashader/panel), which the
  # default py311/312/313 matrix does not install (so it skips those tests). Validate it here in the interactive
  # env. Bokeh/Panel render headless (to HTML; baselines use the matplotlib backend) — no display needed.
  interactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: interactive
          activate-environment: interactive
          cache: true
          version: v0.73.0

      - name: Run interactive tier tests
        # `test-interactive` = pytest tests/test_interactive_*.py --cov=src/digitalearth --cov-report=xml.
        # The default py311/312/313 matrix skips these tests, so this is the only coverage for interactive/.
        run: |
          pixi run -e interactive test-interactive

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5

  # The interactive notebook gallery, rendered in the interactive env. Notebooks 01/06/07 read the WorldClim stack
  # in the gitignored examples/data/global/; each guards those cells to render locally when present and skip in CI.
  notebooks-interactive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: interactive
          activate-environment: interactive
          cache: true
          version: v0.73.0

      - name: Check the interactive notebooks render
        run: |
          pixi run -e interactive notebooks-interactive

  # The web (MapLibre + deck.gl) tier needs the `web` extra (maplibre/lonboard), which the default
  # py311/312/313 matrix does not install (so it skips those tests). Validate it here in the web env.
  # anywidget renders to HTML headless — no display/xvfb needed.
  tests-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: web
          activate-environment: web
          cache: true
          version: v0.73.0

      - name: Run web tier tests
        # `test-web` = pytest tests/test_web_*.py --cov=src/digitalearth --cov-report=xml.
        # The default py311/312/313 matrix skips these tests, so this is the only coverage for web/.
        run: |
          pixi run -e web test-web

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5

  # The web notebook gallery, rendered headless in the web env (anywidget -> HTML; no browser needed).
  notebooks-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: web
          activate-environment: web
          cache: true
          version: v0.73.0

      - name: Check the web notebooks render
        run: |
          pixi run -e web notebooks-web

  # Browser smoke test for the deck.gl layers (review H1): load a saved WebMap with a deck.gl layer in a
  # headless Chromium and assert deck.gl renders a canvas with no uncaught JS error / spec rejection.
  # Playwright + Chromium are NOT in the [web] extra, so they are installed ad-hoc here (the default
  # tests-web job skips this test).
  deck-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0 # pixi/v1.2.1
        with:
          environments: web
          activate-environment: web
          cache: true
          version: v0.73.0

      - name: Install Playwright + Chromium
        # Pin a bounded range so the smoke test is reproducible — an unpinned install pulls whatever ships that
        # day into the locked `web` env, outside pixi's lock (review L1).
        run: |
          pixi run -e web pip install "playwright>=1.44,<2"
          pixi run -e web playwright install --with-deps chromium

      - name: Run the deck.gl browser smoke test
        run: |
          pixi run -e web pytest tests/test_web_deck_smoke.py -v
